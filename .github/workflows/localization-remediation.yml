name: Localization remediation loop

on:
  push:
    branches:
      - localize/ko-KR-adversarial
    paths:
      - .github/scripts/localize_remediation.py
      - .github/workflows/localization-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localize/ko-KR-adversarial
          fetch-depth: 0

      - name: Apply exact localization remediations
        run: python3 .github/scripts/localize_remediation.py

      - name: Commit remediated files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No localization changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend web/src
          git commit -m "fix(i18n): remediate low-count Chinese remnants"
          git push origin HEAD:localize/ko-KR-adversarial
