name: Localization remediation loop

on:
  push:
    branches:
      - localize/ko-KR-adversarial
    paths:
      - .github/scripts/localize_remediation.py
      - .github/scripts/localize_remediation_batch2.py
      - .github/scripts/localize_remediation_batch3.py
      - .github/scripts/localize_remediation_batch4.py
      - .github/scripts/localize_remediation_batch5_preface.py
      - .github/scripts/localize_remediation_batch5.py
      - .github/scripts/localize_remediation_batch6_preface.py
      - .github/scripts/localize_remediation_batch6.py
      - .github/workflows/localization-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localize/ko-KR-adversarial
          fetch-depth: 0

      - name: Apply exact localization remediations
        run: |
          python3 .github/scripts/localize_remediation.py
          python3 .github/scripts/localize_remediation_batch2.py
          python3 .github/scripts/localize_remediation_batch3.py
          python3 .github/scripts/localize_remediation_batch4.py
          python3 .github/scripts/localize_remediation_batch5_preface.py
          python3 .github/scripts/localize_remediation_batch5.py
          python3 .github/scripts/localize_remediation_batch6_preface.py
          python3 .github/scripts/localize_remediation_batch6.py

      - name: Commit remediated files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No localization changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend web/src
          git commit -m "fix(i18n): remediate FinOps notification and backup remnants"
          git push origin HEAD:localize/ko-KR-adversarial
