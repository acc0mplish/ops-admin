name: Korean localization guard

on:
  push:
    branches:
      - localize/ko-KR-adversarial
      - main
  pull_request:

jobs:
  no-hardcoded-chinese:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject Chinese text in product source and docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          roots = [Path('web/src'), Path('backend'), Path('docs')]
          extra_files = [Path('README.md'), Path('web/README.md')]
          text_suffixes = {'.go', '.vue', '.js', '.mjs', '.md', '.html', '.json', '.yaml', '.yml', '.css', '.txt'}
          cjk = re.compile(r'[\u3400-\u4DBF\u4E00-\u9FFF]')
          ignored_parts = {'.git', 'node_modules', 'dist', 'uploads'}
          findings = []

          files = list(extra_files)
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in text_suffixes:
                      continue
                  if any(part in ignored_parts for part in path.parts):
                      continue
                  files.append(path)

          for path in files:
              if not path.exists():
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError:
                  continue
              for lineno, line in enumerate(lines, 1):
                  if cjk.search(line):
                      findings.append((str(path), lineno, line.strip()))

          if findings:
              print(f'Found {len(findings)} line(s) containing Chinese characters in {len(set(p for p, _, _ in findings))} file(s):')
              for path, lineno, line in findings:
                  print(f'{path}:{lineno}: {line}')
              sys.exit(1)

          print('PASS: no Chinese characters found in product source or documentation.')
          PY
