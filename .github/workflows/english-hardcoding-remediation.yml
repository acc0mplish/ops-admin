name: English hardcoding remediation

on:
  push:
    branches:
      - localize/ko-KR-adversarial
    paths:
      - .github/scripts/fix_english_hardcoding_batch1.py
      - .github/workflows/english-hardcoding-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localize/ko-KR-adversarial
          fetch-depth: 0

      - name: Apply first English UI remediation batch
        run: python3 .github/scripts/fix_english_hardcoding_batch1.py

      - name: Commit remediated files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No English hardcoding changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src
          git commit -m "fix(i18n): move direct English UI labels to locale catalog"
          git push origin HEAD:localize/ko-KR-adversarial
