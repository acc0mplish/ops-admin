name: English hardcoding audit

on:
  push:
    branches:
      - localize/ko-KR-adversarial
    paths:
      - .github/scripts/audit_english_hardcoding.py
      - .github/workflows/english-hardcoding-audit.yml
      - web/src/**
      - backend/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localize/ko-KR-adversarial

      - name: Scan likely user-visible English hardcoding
        run: python3 .github/scripts/audit_english_hardcoding.py

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: english-hardcoding-audit
          path: artifacts/english-hardcoding-*
          if-no-files-found: error
          retention-days: 7
