name: Frontend localization build

on:
  push:
    branches:
      - localize/ko-KR-adversarial
    paths:
      - web/src/**
      - web/package.json
      - web/package-lock.json
      - .github/workflows/frontend-localization-build.yml
  pull_request:
    paths:
      - web/src/**
      - web/package.json
      - web/package-lock.json

permissions:
  contents: read

concurrency:
  group: frontend-localization-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build production bundle
        working-directory: web
        run: npm run build
