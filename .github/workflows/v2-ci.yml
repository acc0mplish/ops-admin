name: V2 CI

on:
  push:
    branches:
      - main
  pull_request:

# Required checks are registered per job (branch protection, post-merge manual
# step — docs/security/ci-baseline.md). No path filters: a required check
# combined with a path filter sticks pending on out-of-scope PRs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Test all backend packages
        working-directory: backend
        run: go test ./... -race -count=1
      - name: opdef coverage latch (baseline 65.4, gate 60.0)
        working-directory: backend
        run: |
          cov="$(go test ./opdef/ -cover | sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p')"
          echo "opdef coverage: ${cov}%"
          if awk -v c="$cov" 'BEGIN { exit !(c >= 60.0) }'; then
            echo "PASS: opdef coverage ${cov}% >= 60.0 latch (raise the latch with new coverage — never lower it)"
          else
            echo "FAIL: opdef coverage ${cov}% below the 60.0 latch"
            exit 1
          fi

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install and build the web console
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

  migration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Reopen the committed baseline fixture and migrate it
        working-directory: backend
        run: go test ./store/ -run TestMigrationFixture -count=1 -v

  route-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Route inventory, sensitive-route table, opdef coverage of the live router
        working-directory: backend
        run: go test ./router/ -run 'TestRouteInventoryArtifact|TestSensitiveRoutesArtifact|TestOperationTableCoversRouter' -count=1

  route-coverage-canary:
    # A canary that does not fire fails CI (plan §4.10 / D-5): plant an
    # unlisted non-GET route in a scratch copy and require
    # TestOperationTableCoversRouter to reject it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Plant an unlisted POST route in a scratch copy
        run: |
          cp -r "$GITHUB_WORKSPACE" "$RUNNER_TEMP/canary"
          cd "$RUNNER_TEMP/canary/backend"
          sed -i 's|authGroup.GET("/profile", ctl.Profile)|authGroup.GET("/profile", ctl.Profile)\n\t\tauthGroup.POST("/canary/unlisted", func(c *gin.Context) {})|' router/router.go
          grep -q 'authGroup.POST("/canary/unlisted"' router/router.go || {
            echo "CANARY PLANT FAILED: /profile anchor drifted — the injection silently did nothing"
            exit 1
          }
      - name: The unlisted route must be caught (test failure is required)
        run: |
          cd "$RUNNER_TEMP/canary/backend"
          if go test ./router/ -run TestOperationTableCoversRouter -count=1; then
            echo "CANARY DID NOT FIRE: TestOperationTableCoversRouter passed with an unlisted POST route planted"
            exit 1
          fi
          echo "CANARY OK: the planted unlisted route was rejected"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan the tree for secrets and guard the untracked config files
        run: python3 scripts/secret-scan.py

  secret-scan-canary:
    # A canary that does not fire fails CI: plant the workflow's own canary
    # literals at the scratch root — outside the .github/workflows allowlist
    # scope — and require the scanner to fire AND to attribute the finding to
    # the planted file (H2: not a scanner self-hit).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Plant a canary leak in a scratch copy and require the scanner to fire
        run: |
          cp -r "$GITHUB_WORKSPACE" "$RUNNER_TEMP/canary"
          printf 'aws_secret_access_key = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"\naws_access_key_id = "AKIAIOSFODNN7EXAMPLE"\n' > "$RUNNER_TEMP/canary/canary-leak.txt"
          if python3 scripts/secret-scan.py "$RUNNER_TEMP/canary" > "$RUNNER_TEMP/canary-output.txt"; then
            echo "CANARY DID NOT FIRE: scanner exited 0 over a planted secret"
            exit 1
          fi
          grep -q 'canary-leak.txt' "$RUNNER_TEMP/canary-output.txt" || {
            echo "CANARY ATTRIBUTION FAILED: the firing report does not name the planted file"
            exit 1
          }
          grep 'SECRET:' "$RUNNER_TEMP/canary-output.txt"
          echo "CANARY OK: the planted file fired with correct attribution"

  arch-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Core provider isolation and opdef purity rules
        run: bash scripts/check-arch-boundary.sh

  arch-boundary-canary:
    # Standing canary — a canary that does not fire fails CI (spec §4.10).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Plant R1+R2 violations in a scratch copy
        run: |
          cp -r "$GITHUB_WORKSPACE" "$RUNNER_TEMP/canary"
          cd "$RUNNER_TEMP/canary/backend"
          # R1 plant: valid blank import, sed-inserted into the existing import
          # block (an appended `import` after declarations is a syntax error and
          # would fire for the wrong reason).
          sed -i 's|^\t"context"$|\t"context"\n\t_ "ops-admin/backend/internal/domain/provider"|' internal/domain/dnsserver/server.go
          grep -q 'internal/domain/provider' internal/domain/dnsserver/server.go || { echo "CANARY PLANT FAILED: sed anchor drifted"; exit 1; }
          # R2 plant: a comment is enough — R2 greps source text, so the plant
          # cannot fail for a syntax reason.
          printf '\n// canary plant: tencent product identifier\n' >> internal/domain/dnsserver/server.go
      - name: The planted violations must be caught (failure is required)
        run: |
          cd "$RUNNER_TEMP/canary"
          if bash scripts/check-arch-boundary.sh > out.txt 2>&1; then
            echo "CANARY DID NOT FIRE: arch-boundary passed with planted violations"; exit 1
          fi
          grep -q 'R1 FAIL' out.txt || { echo "CANARY ATTRIBUTION FAILED: no R1 FAIL"; exit 1; }
          grep -q 'R2 FAIL' out.txt || { echo "CANARY ATTRIBUTION FAILED: no R2 FAIL"; exit 1; }
          grep -E 'R[12] FAIL' out.txt

      # Phase 4 J8/E-4 — the R2 v2 cloud-branch canary: a provider-name branch
      # inside a core package must fire (product code), while the same
      # identifier in a core _test.go must pass (the scan excludes tests by
      # design — the second copy asserts the exclusion rule itself, so it
      # cannot quietly rot into either a false positive or a blind spot).
      - name: Plant a cloud provider branch in the core (R2 v2)
        run: |
          cp -r "$GITHUB_WORKSPACE" "$RUNNER_TEMP/canary-cloud-product"
          cd "$RUNNER_TEMP/canary-cloud-product/backend"
          printf '\nfunc canaryCloudBranch(p string) bool {\n\treturn p == "aliyun"\n}\n' >> internal/infra/contract/provider_type.go
          grep -q 'return p == "aliyun"' internal/infra/contract/provider_type.go || { echo "CANARY PLANT FAILED: cloud branch anchor drifted"; exit 1; }
          cp -r "$GITHUB_WORKSPACE" "$RUNNER_TEMP/canary-cloud-test"
          cd "$RUNNER_TEMP/canary-cloud-test/backend"
          printf '\n// canary plant: provider product identifier in a core test file\nvar canaryTestPlant = "aliyun"\n' >> internal/infra/contract/contract_test.go
          grep -q 'canaryTestPlant = "aliyun"' internal/infra/contract/contract_test.go || { echo "CANARY PLANT FAILED: test-file plant anchor drifted"; exit 1; }
      - name: The product-code branch must fire, the test-file branch must pass
        run: |
          cd "$RUNNER_TEMP/canary-cloud-product"
          if bash scripts/check-arch-boundary.sh > out-cloud.txt 2>&1; then
            echo "CANARY DID NOT FIRE: a cloud provider branch passed in core product code"; exit 1
          fi
          grep -q 'R2 FAIL' out-cloud.txt || { echo "CANARY ATTRIBUTION FAILED: cloud branch did not fire R2"; exit 1; }
          grep -q 'provider_type.go' out-cloud.txt || { echo "CANARY ATTRIBUTION FAILED: cloud branch not attributed to the core contract file"; exit 1; }
          grep 'R2 FAIL' out-cloud.txt
          cd "$RUNNER_TEMP/canary-cloud-test"
          if ! bash scripts/check-arch-boundary.sh > out-cloud-test.txt 2>&1; then
            echo "CANARY FALSE POSITIVE: a core _test.go identifier fired R2 (the test exclusion regressed)"; exit 1
          fi
          grep 'PASS: arch-boundary clean' out-cloud-test.txt
          echo "CANARY OK: cloud branch fires in product code, passes in core tests"

      # ④review HIGH-1 (phase4 J8/E-4): the inventory core is enrolled in R2
      # now — a CASE-SHAPED provider branch planted there must fire with
      # correct attribution. This is the exact shape the cloud backfill
      # carried before its alias table moved into the contract vocabulary, so
      # a reintroduction cannot slip back through the new package set.
      - name: Plant a provider case branch in the inventory core (R2 v2)
        run: |
          cp -r "$GITHUB_WORKSPACE" "$RUNNER_TEMP/canary-inventory-case"
          cd "$RUNNER_TEMP/canary-inventory-case/backend"
          printf '\nfunc canaryInventoryCase(p string) string {\n\tswitch p {\n\tcase "aliyun":\n\t\treturn "aliyun"\n\t}\n\treturn ""\n}\n' >> internal/infra/inventory/cloudcompare.go
          grep -q 'case "aliyun"' internal/infra/inventory/cloudcompare.go || { echo "CANARY PLANT FAILED: inventory case anchor drifted"; exit 1; }
      - name: The planted inventory case branch must be caught (failure is required)
        run: |
          cd "$RUNNER_TEMP/canary-inventory-case"
          if bash scripts/check-arch-boundary.sh > out-inv.txt 2>&1; then
            echo "CANARY DID NOT FIRE: a provider case branch passed in the inventory core"; exit 1
          fi
          grep -q 'R2 FAIL' out-inv.txt || { echo "CANARY ATTRIBUTION FAILED: inventory branch did not fire R2"; exit 1; }
          grep -q 'internal/infra/inventory/cloudcompare.go' out-inv.txt || { echo "CANARY ATTRIBUTION FAILED: branch not attributed to the inventory core file"; exit 1; }
          grep 'R2 FAIL' out-inv.txt
          echo "CANARY OK: the inventory case branch fired with correct attribution"

  slice-a-e2e:
    # Plan J11 — the 10th job: §25's "one Kubernetes mutation end to end in CI
    # against kind". Fresh kind cluster per run (plan §4.9), the committed seed
    # fixture (N17) applied idempotently, the §15 compare segment captured as a
    # non-BLOCKER artifact, then the two-layer split: the N16 Go trace (crash
    # injection) and the N15 Playwright UI flow (stack owned by the webServer —
    # N14). Not a required check (plan: standing evidence, stabilization first).
    # Merge verdict is the local reproduction, not this job (plan §10).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      SLICEA_CONTEXT: kind-v2-p3
      SLICEA_MYSQL_HOST: 127.0.0.1
      SLICEA_MYSQL_PORT: '3306'
      SLICEA_MYSQL_USER: root
      SLICEA_MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2
      - name: Install the Playwright chromium browser
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Create the kind cluster and pre-load the seed image (H1/R12)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kind" https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x "$RUNNER_TEMP/kind"
          "$RUNNER_TEMP/kind" create cluster --name v2-p3 --image kindest/node:v1.34.0 --wait 180s
          docker pull nginx:1.27-alpine
          "$RUNNER_TEMP/kind" load docker-image nginx:1.27-alpine --name v2-p3
      - name: Apply the committed seed fixture (N17)
        run: |
          kubectl --context "$SLICEA_CONTEXT" apply -f v2-phase1/k8s-fixture/seed.yaml
          kubectl --context "$SLICEA_CONTEXT" -n v3-seed rollout status deploy/restart-target --timeout=180s
      - name: Register the cluster, sync, and capture the §15 comparison (non-BLOCKER)
        working-directory: web
        env:
          E2E_SCHEMA: ops_admin_p3ci
        run: |
          bash e2e/stack.sh compare
          bash e2e/stack.sh down
      - name: Upload the compare-inventory report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-inventory-report
          path: web/e2e/.stack/data/
          if-no-files-found: error
      - name: Go trace E2E — crash injection + §25 trace (dedicated schema VK-7)
        working-directory: backend
        run: |
          # Risk R3 mitigation — one retry against transient rollout flake. The
          # harness drops and recreates its dedicated schema, so a rerun is
          # clean by construction.
          go test -tags=e2e ./e2e/slicea/ -count=1 -v \
            || { sleep 10; go test -tags=e2e ./e2e/slicea/ -count=1 -v; }
      - name: Playwright UI flow (N14/N15 — webServer owns the stack)
        working-directory: web
        env:
          E2E_SCHEMA: ops_admin_p3ui
          E2E_ADMIN_PASSWORD: slicea-e2e-admin
        run: bun run e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/e2e/playwright-report/
          if-no-files-found: ignore
      - name: Upload the backend child log on failure (dirty runbook VK-12)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: web/e2e/.stack/backend.log
          if-no-files-found: ignore
