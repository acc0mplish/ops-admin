name: English hardcoding remediation batch 2

on:
  push:
    branches:
      - localize/ko-KR-adversarial
    paths:
      - .github/scripts/fix_english_hardcoding_batch2.py
      - .github/workflows/english-hardcoding-remediation-batch2.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localize/ko-KR-adversarial
          fetch-depth: 0

      - name: Record audit baseline
        shell: bash
        run: |
          python3 .github/scripts/audit_english_hardcoding.py \
            --tsv /tmp/english-before.tsv \
            --json /tmp/english-before.json \
            --markdown /tmp/english-before.md > /tmp/audit-before.log

      - name: Apply mixed English UI remediation
        run: python3 .github/scripts/fix_english_hardcoding_batch2.py | tee /tmp/remediation-batch2.log

      - name: Re-run English hardcoding audit
        shell: bash
        run: |
          python3 .github/scripts/audit_english_hardcoding.py \
            --tsv /tmp/english-after.tsv \
            --json /tmp/english-after.json \
            --markdown /tmp/english-after.md > /tmp/audit-after.log

      - name: Verify frontend production build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify backend tests
        working-directory: backend
        run: go test ./...

      - name: Commit remediated files
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No English hardcoding changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src
          git commit -m "fix(i18n): localize mixed English UI strings"
          git push origin HEAD:localize/ko-KR-adversarial
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment progress on issue 3
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/issue-comment.md
          import json
          import os
          from collections import Counter

          def load(path):
              try:
                  return json.load(open(path, encoding='utf-8'))
              except Exception:
                  return []

          before = load('/tmp/english-before.json')
          after = load('/tmp/english-after.json')
          before_levels = Counter(item.get('severity') for item in before)
          after_levels = Counter(item.get('severity') for item in after)
          commit = os.environ.get('COMMIT_SHA') or '(commit not created)'

          print('## English hardcoding remediation batch 2')
          print()
          print(f'- Commit: `{commit}`')
          print(f'- Audit candidates: **{len(before)} → {len(after)}**')
          print(f'- High confidence: **{before_levels["high"]} → {after_levels["high"]}**')
          print(f'- Medium confidence: **{before_levels["medium"]} → {after_levels["medium"]}**')
          print(f'- Low confidence: **{before_levels["low"]} → {after_levels["low"]}**')
          print('- Vue production build: passed')
          print('- `go test ./...`: passed')
          print()
          print('This batch moved direct/mixed strings in Database Workbench, CI/CD Pipeline, Monitoring Dashboard, and Alert Rule screens into the ko-KR/en-US catalog.')
          PY
          gh issue comment 3 --repo acc0mplish/ops-admin --body-file /tmp/issue-comment.md
