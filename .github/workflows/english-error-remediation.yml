name: English error remediation

on:
  push:
    branches:
      - localize/ko-KR-adversarial
    paths:
      - .github/scripts/remediate_english_errors_batch1.py
      - .github/workflows/english-error-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localize/ko-KR-adversarial
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply error-code remediation
        run: python3 .github/scripts/remediate_english_errors_batch1.py

      - name: Format Go sources
        run: gofmt -w backend/apperr/error.go backend/httpx/response.go backend/controller/asset_service.go backend/service/asset_service.go

      - name: Run backend tests
        working-directory: backend
        run: go test ./...

      - name: Commit remediated sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "refactor(api): convert asset service errors to stable codes"
          git push origin HEAD:localize/ko-KR-adversarial
