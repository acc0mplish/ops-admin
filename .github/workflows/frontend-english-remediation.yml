name: Frontend English remediation

on:
  push:
    branches:
      - localize/ko-KR-adversarial
    paths:
      - .github/scripts/remediate_frontend_english_batch1.py
      - .github/workflows/frontend-english-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-english-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localize/ko-KR-adversarial
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply frontend remediation
        run: python3 .github/scripts/remediate_frontend_english_batch1.py

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build production bundle
        working-directory: web
        run: npm run build

      - name: Commit remediated sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src
          git commit -m "fix(i18n): remove command center English hardcoding"
          git pull --rebase origin localize/ko-KR-adversarial
          git push origin HEAD:localize/ko-KR-adversarial
