# 完整告警模板：由夜莺 download (3).json 与现有模板库合并生成。
# 可粘贴到：告警模板 > 粘贴 Prometheus 模板。

groups:
  - name: szfc / szfc
    interval: 1m
    rules:
      - alert: SZFC Deployment副本不可用
        expr: kube_deployment_status_replicas_unavailable{deployment=~"szfc-.*"} > 0
        for: 5m
        labels:
          severity: p2
      - alert: Szfc JVM GC压力过高
        expr: |-
          (
            sum by (namespace, pod) (rate(jvm_gc_collection_seconds_sum{namespace=~"szfc.*"}[5m]))
            /
            clamp_min(sum by (namespace, pod) (rate(process_cpu_seconds_total{namespace=~"szfc.*"}[5m])), 0.001)
          ) * 100 > 30
        for: 5m
        labels:
          severity: p2
      - alert: Szfc JVM GC暂停时间过高
        expr: sum by (namespace, pod) (rate(jvm_gc_collection_seconds_sum{namespace=~"szfc.*"}[5m])) > 0.5
        for: 5m
        labels:
          severity: p2
      - alert: Szfc JVM进程CPU使用率过高
        expr: avg by (namespace, pod) (rate(process_cpu_seconds_total{namespace=~"szfc.*"}[5m])) * 100 > 80
        for: 5m
        labels:
          severity: p2
          category: jvm
      - alert: Szfc JVM进程发生重启
        expr: changes(process_start_time_seconds{namespace=~"szfc.*"}[10m]) > 0
        for: 5m
        labels:
          severity: p2
          category: jvm
      - alert: Szfc-JVM线程数过高
        expr: jvm_threads_current{namespace=~"szfc.*"} > 500
        for: 5m
        labels:
          severity: p2
          category: jvm
      - alert: SzfcJVM出现死锁线程
        expr: jvm_threads_deadlocked{namespace=~"szfc.*"} > 0
        for: 5m
        labels:
          severity: p1
          category: jvm
      - alert: SzfcJVM堆内存使用率过高
        expr: |-
          (
            sum by (namespace, pod) (jvm_memory_bytes_used{namespace=~"szfc.*", area="heap"})
            /
            clamp_min(sum by (namespace, pod) (jvm_memory_bytes_max{namespace=~"szfc.*", area="heap"}), 1)
          ) * 100 > 90
        for: 5m
        labels:
          severity: p1
          category: jvm
      - alert: SzfcJVM文件句柄使用率过高
        expr: |-
          (process_open_fds{namespace=~"szfc.*"} / clamp_min(process_max_fds{namespace=~"szfc.*"}, 1)) * 100 > 80
        for: 5m
        labels:
          severity: p2
          category: jvm
      - alert: SzfcJVM非堆内存使用率过高
        expr: |-
          (
            sum by (namespace, pod) (jvm_memory_bytes_used{namespace=~"szfc.*", area="nonheap"})
            /
            clamp_min(sum by (namespace, pod) (kube_pod_container_resource_limits{namespace=~"szfc.*", resource="memory", unit="byte"}), 1)
          ) * 100 > 20
        for: 5m
        labels:
          severity: p2
          category: jvm
      - alert: SZFC内存Limit使用率过高
        expr: |-
          100 * sum by (namespace, pod) (container_memory_working_set_bytes{namespace="szfc", pod=~"szfc-.*", container!="", image!=""})
          /
          sum by (namespace, pod) (kube_pod_container_resource_limits{namespace="szfc", pod=~"szfc-.*", resource="memory"}) > 85
        for: 5m
        labels:
          severity: p2
          category: szfc-game
      - alert: SZFC容器CrashLoopBackOff
        expr: kube_pod_container_status_waiting_reason{namespace="szfc", pod=~"szfc-.*", reason="CrashLoopBackOff"} == 1
        for: 5m
        labels:
          severity: p1
          category: szfc-game
      - alert: SZFC容器NotReady
        expr: kube_pod_container_status_ready{namespace="szfc", pod=~"szfc-.*", container!=""} == 0
        for: 5m
        labels:
          severity: p1
          category: szfc-game
      - alert: SZFC容器镜像拉取失败
        expr: kube_pod_container_status_waiting_reason{namespace="szfc", pod=~"szfc-.*", reason=~"ImagePullBackOff|ErrImagePull"} == 1
        for: 5m
        labels:
          severity: p1
          category: szfc-game
      - alert: SZFC服务Pod异常
        expr: sum by (namespace, pod, phase) (kube_pod_status_phase{namespace="szfc", pod=~"szfc-.*", phase=~"Pending|Failed|Unknown"}) > 0
        for: 5m
        labels:
          severity: p1
          category: szfc-game
