# v2 Phase 3 Slice A — kind 2호기(v2-p3) 시드 fixture (계획 N17)
#
# 대상: kind 클러스터 `v2-p3` 전용 (phase2 게이트 클러스터 v2-p2 무변경 —
# 계획 §0.2a 게이트 자산 보호, 보존 제약 #11). run-fixture.sh이 본 파일을
# kubectl apply한다 (멱등 — 수렴 적용).
#
# minReadySeconds: 10 — 크래시 주입(G1 게이트 ②)의 킬 창 결정성 장치.
# rollout restart 후 availableReplicas가 spec.replicas에 도달하기까지
# 최소 10초가 보장되므로, 태스크가 running으로 관찰되는 창이 충분히 넓어
# SIGKILL 타이밍이 결정적이 된다 (계획 R2/H1·J2 교정 판정식과 연동).
# 이미지는 kind 노드에 사전 적재된 nginx:1.27-alpine (슬로우 풀 리스크 R12 제거).
#
# v2 Phase 4 (Phase F말 — 이월 대장 #2) 추가: statefulset·daemonset 1종씩.
# executor의 workload 3종(deployment/statefulset/daemonset) 중 2종이 시드에
# 없던 갭 보험 — slice-b E2E의 종별 커버 (phase3-plan N17 판정식 승계).
# apply 멱등 — run-fixture.sh 재실행으로 수렴 확인.
#
# P1-C2 (P 계획 J-P1-2·§9-10) 추가: Job 1·CronJob 1 — job·cronjob 비교 집합
# 합류의 양측 비공헌 시드(R-P1). churn 안전 장치(R-P10):
#   - CronJob은 suspend: true — 스케줄 시점에 Job을 자동 생성하지 않는다(회전
#     자원 churn 차이 재발 차단). 재판정 재개(I-P5·PC-5)까지 수동 유지.
#   - Job은 completions: 1 단회 실행 — 완료 후 status가 고정된다(재실행 없음).
#   - 본 시드는 저장소 선언이지 클러스터 현재 상태의 스냅숏이 아니다 —
#     클러스터 재시딩 전 비교 판정은 실행 클러스터 상태를 따른다.
apiVersion: v1
kind: Namespace
metadata:
  name: v3-seed
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-job
  namespace: v3-seed
  labels:
    app: seed-job
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: seed-job
    spec:
      restartPolicy: Never
      containers:
        - name: busy
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo seed-job done"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seed-cron
  namespace: v3-seed
  labels:
    app: seed-cron
spec:
  schedule: "0 3 * * *"
  suspend: true # R-P10 — 중단 상태 유지(자원 회전 없음), 재판정 시점에 해제
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: seed-cron
        spec:
          restartPolicy: Never
          containers:
            - name: busy
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "echo seed-cron done"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restart-target
  namespace: v3-seed
  labels:
    app: restart-target
spec:
  replicas: 2
  minReadySeconds: 10
  selector:
    matchLabels:
      app: restart-target
  template:
    metadata:
      labels:
        app: restart-target
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: restart-target-sts
  namespace: v3-seed
  labels:
    app: restart-target-sts
spec:
  replicas: 1
  serviceName: restart-target-sts
  selector:
    matchLabels:
      app: restart-target-sts
  template:
    metadata:
      labels:
        app: restart-target-sts
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: restart-target-ds
  namespace: v3-seed
  labels:
    app: restart-target-ds
spec:
  selector:
    matchLabels:
      app: restart-target-ds
  template:
    metadata:
      labels:
        app: restart-target-ds
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
